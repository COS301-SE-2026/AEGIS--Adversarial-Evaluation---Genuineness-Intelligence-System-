name: Dev CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend Python files
        run: python -m compileall app tests

      - name: Lint check (basic)
        run: pip install flake8 && flake8 app

      - name: Run backend tests
        run: |
          pip install pytest pytest-asyncio httpx pytest-cov
          pytest tests/ -v --cov=app --cov-branch --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-integration-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: aegis_test
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://aegis_test:aegis_test@localhost:5432/aegis_test
      DATABASE_URL: postgresql://test:test@localhost/test
      SECRET_KEY: test-secret-key
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: http://localhost/callback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==26.2
          pip install --only-binary :all: -r requirements.txt

      - name: Run real-database integration tests
        run: |
          pip install --only-binary :all: pytest==7.4.3 pytest-asyncio==0.21.1 httpx==0.25.2 pytest-cov==7.1.0
          pytest tests/integration -v -m integration
