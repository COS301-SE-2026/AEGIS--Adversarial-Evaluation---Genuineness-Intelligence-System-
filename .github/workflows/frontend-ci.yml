name: Frontend CI

on:
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # this is added so codecov can correctly trace commit history

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5df2 # v4.0.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@39225d34a2428c94226b2849866650917f35759b # v4.2.0
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js Cache
        uses: actions/cache@d4323d4df104b026a6e563059ef1585740426fac # v4.2.2
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-


      - name: Run Linter
        run: pnpm --dir frontend lint

      - name: Build Application
        run: pnpm --dir frontend build

      - name: Run tests with coverage
        run: pnpm --dir frontend test --coverage --coverageReporters=lcov --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3 # v5.3.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}