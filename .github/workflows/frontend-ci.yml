name: Frontend CI

on:
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout<PINNED_SHA>

      - name: Install pnpm
        uses: pnpm/action-setup<PINNED_SHA>
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node<PINNED_SHA>
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js Cache
        uses: actions/cache<PINNED_SHA>
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-


      - name: Run Linter
        run: pnpm --dir frontend lint

      - name: Build Application
        run: pnpm --dir frontend build

      - name: Run tests with coverage
        run: pnpm --dir frontend test --coverage --coverageReporters=lcov --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5<40-character-commit-sha>
        with:
          token: ${{ secrets.CODECOV_TOKEN }}